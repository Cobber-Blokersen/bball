[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bball"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "ortools",
  "rich",
  "typer",
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "authlib",
  "pydantic",
  "python-multipart",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
]

[tool.uv]
required-version = ">0.9"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "B", "C4", "UP", "N", "ANN", "S", "I", "RET", "SIM", "PL",
]
ignore = [
  "ANN401",
  "PLR0913",
  "PLR2004",
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-v -v -v -x --capture=tee-sys"
